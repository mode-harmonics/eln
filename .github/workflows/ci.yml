# =============================================================================
# CI — Continuous Integration
# Runs on every push and pull request to the main branch.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.12.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eln:eln@127.0.0.1:5432/eln
      JWT_SECRET: ci-isolated-test-jwt-secret
      PORT: 3309
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eln
          POSTGRES_PASSWORD: eln
          POSTGRES_DB: eln
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: eln
          DB_PASSWORD: eln
          DB_NAME: eln
          JWT_SECRET: ci-test-jwt-secret-min-16-char

      - name: Prepare isolated database
        run: |
          cp apps/backend/env/example.env apps/backend/env/local.env
          pnpm --filter @eln/backend run typeorm:run
          pnpm --filter @eln/backend run seed

      - name: Run database E2E tests
        run: pnpm --filter @eln/backend exec jest --config ./test/jest-e2e.json --runInBand

      - name: Run independent HTTP regression suite
        env:
          ELN_REVIEW_ALLOW_WRITES: 'yes'
          ELN_REVIEW_URL: http://127.0.0.1:3309
          ELN_REVIEW_OUTPUT: docs/reviews/api-ci.json
        run: |
          (cd apps/backend && node dist/main.js) > /tmp/eln-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3309/api/docs-json > /dev/null; then break; fi
            sleep 1
          done
          node apps/backend/test/independent-api-review.mjs

      - name: Upload HTTP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-results
          path: docs/reviews/api-ci.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: true
          tags: eln-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          load: true
          tags: eln-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
